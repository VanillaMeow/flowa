# Four spaces and one indentation level per nested argument list
indent_columns = 4
indent_with_tabs = 0
indent_continue = 0
indent_param = 4
indent_align_paren = false
indent_align_assign = false
indent_paren_nl = false
indent_paren_close = 2
indent_func_call_param = true
indent_func_def_param = true
indent_func_proto_param = true
indent_switch_case = 4

# Split long headers without aligning their contents under the opening parenthesis
code_width = 88
ls_for_split_full = true
ls_func_split_full = true
nl_multi_line_sparen_open = force
nl_multi_line_sparen_close = force
nl_multi_line_cond = false

# Keep opening braces attached to functions and control statements
nl_if_brace = remove
nl_for_brace = remove
nl_while_brace = remove
nl_switch_brace = remove
nl_fdef_brace = remove
nl_assign_brace = remove
nl_else_brace = remove
nl_brace_else = remove

# Keep each wrapped parameter or argument on its own line
nl_func_decl_start_multi_line = true
nl_func_def_start_multi_line = true
nl_func_decl_args_multi_line = true
nl_func_def_args_multi_line = true
nl_func_decl_end_multi_line = true
nl_func_def_end_multi_line = true
nl_func_call_start_multi_line = true
nl_func_call_args_multi_line = true
nl_func_call_end_multi_line = true

# Use ordinary spaces around operators and no spaces inside parentheses
sp_before_sparen = force
sp_sparen_brace = force
sp_fparen_brace = force
pos_bool = trail
sp_assign = force
sp_arith = force
sp_bool = force
sp_compare = force
sp_cond_question = force
sp_cond_colon = force
sp_after_comma = force
sp_before_comma = remove
sp_inside_paren = remove
sp_inside_fparen = remove
sp_inside_sparen = remove
sp_func_call_paren = remove
sp_func_def_paren = remove
sp_func_proto_paren = remove
sp_before_ptr_star = force
sp_after_ptr_star = remove

# End every file with a single newline
nl_end_of_file = force
nl_end_of_file_min = 1
