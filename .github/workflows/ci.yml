name: Check

on:
  push:
  pull_request:

jobs:
  linux-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libdav1d-dev libheif-dev libclang-dev
      # The portable workflow builds video with the pinned FFmpeg 9 SDK
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --no-default-features --features avif,heif -- -D warnings
      - run: cargo check --locked --no-default-features
      - run: cargo test --locked --no-default-features --features avif,heif

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --no-default-features
