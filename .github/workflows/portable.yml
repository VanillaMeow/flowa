name: Build Linux Portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-ubuntu-24.04
          cache-directories: target/portable-cargo

      - uses: actions/cache@v6
        with:
          path: .cache/portable-deps
          key: portable-native-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('tools/portable/build.sh', 'tools/portable/dependencies.sh', 'tools/portable/Containerfile', 'tools/portable/*.patch') }}

      - name: Build the single portable executable
        run: just portable

      - uses: actions/upload-artifact@v7
        with:
          path: target/x86_64-unknown-linux-gnu/portable/flowa
          archive: false
          if-no-files-found: error
