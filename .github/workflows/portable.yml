name: Build Linux Portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl pkg-config cmake meson ninja-build nasm \
            xz-utils git binutils

      - name: Compute native cache key
        id: native-cache
        run: |
          native_key=$(./packaging/linux/build-portable.sh --print-native-cache-key)
          echo "key=$native_key" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-ubuntu-24.04-${{ steps.native-cache.outputs.key }}

      - uses: actions/cache@v6
        with:
          path: .cache/portable-deps
          key: portable-native-ubuntu-24.04-${{ runner.arch }}-${{ steps.native-cache.outputs.key }}

      - name: Build with bundled codecs
        run: ./packaging/linux/build-portable.sh

      - name: Check the glibc baseline
        run: ./packaging/linux/check-portable.sh target/x86_64-unknown-linux-gnu/portable/flowa 2.39

      - uses: actions/upload-artifact@v7
        with:
          path: target/x86_64-unknown-linux-gnu/portable/flowa
          archive: false
          if-no-files-found: error
